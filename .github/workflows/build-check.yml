# בודק שהקבצים שמתפרסמים (index.html, mefakdim/index.html) נבנו מהמקור העדכני ב-src/sidur.src.html
name: Build check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Built files match the source
        run: python3 src/build.py --check
